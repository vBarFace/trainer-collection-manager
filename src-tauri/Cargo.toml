[package]
name = "trainer-collection-manager"
version = "0.1.0"
description = "Offline-first Pokémon GO collection manager"
authors = ["Trainer Collection Manager contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
